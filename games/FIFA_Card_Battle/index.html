<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>FIFA Card Battle</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tilt+Warp&display=swap" rel="stylesheet">
  </head>
  <body>
    
<!-- Tela Inicial -->
<div id="inicio" class="screen active">
  <img src="imgs/logo-jogo.png" alt="logo-jogo-FIFA">
  <button onclick="startGame()">JOGAR</button>
  <button onclick="">DASHBOARD</button>
</div>

<!-- Tela do Jogo -->
<div id="game" class="screen">
  
  <!-- Topo -->
  <button onclick="exitGame()">SAIR</button>

  <div class="top-bar">
    <div class="turno" id="turn">Jogador Adversário</div>
    <div class="turno ativo" id="turn">Seu turno</div>
  </div>

  <!-- Adversário -->
  <div class="adv-area">
    <div class="card small adv">?</div>
  </div>

  <!-- Área central -->
  <div class="arena">
    <div id="active-card" class="card large adv"></div>
    <div id="active-card" class="card large"></div>
  </div>

  <!-- Ações -->
  <div class="actions">
    <button onclick="playCard()">Jogar Carta</button>
    <button onclick="useSkill()">Usar Habilidade</button>
    <!-- <button onclick="passTurn()">Passar Turno</button> -->
    <!-- Energia -->
    <div class="energy">
      Energia: <span id="energy">3</span>
    </div>
  </div>

  <!-- Mão -->
  <div id="hand" class="hand"></div>

</div>
<div id="dashboard" class="screen">

</div>
<div id="resultados" class="screen">
  <h1>RESULTADOS</h1>
  <p id=""></p>
</div>

<!-- CARTA -->
<div id="card">
  
</div>

<!--link JS-->
<script src="script.js"></script>

</body>
</html>
